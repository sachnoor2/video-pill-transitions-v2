name: render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install node deps
        run: npm install --no-audit --no-fund

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install python deps
        run: pip install kokoro-onnx soundfile numpy

      - name: Cache Kokoro models
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-voices

      - name: Fetch Kokoro models
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sL -o models/kokoro-v1.0.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sL -o models/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la models

      - name: Narration (Kokoro am_michael) -> manifest
        run: python scripts/tts.py

      - name: Foley
        run: python scripts/foley.py

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Render
        run: npx remotion render src/index.ts Film out/video.mp4 --concurrency=2

      - name: Probe
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,duration \
                  -show_entries format=duration -of default=noprint_wrappers=1 out/video.mp4 | tee out/probe.txt
          ffmpeg -hide_banner -i out/video.mp4 -af volumedetect -f null - 2>&1 | tail -4 | tee -a out/probe.txt
          ffmpeg -hide_banner -i out/video.mp4 -vf blackdetect=d=0.02:pix_th=0.10 -an -f null - 2>&1 | grep -i blackdetect | tee -a out/probe.txt || echo "blackdetect: none" | tee -a out/probe.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film
          path: |
            out/video.mp4
            out/probe.txt
            src/manifest.json
